services:
  - type: web
    name: cidade-zero
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: cidade-zero-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /app/data/cidade_zero.db
      - key: CITY_TICK_SECONDS
        value: "12"
      - key: CITY_MINUTES_PER_TICK
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MAX_CALLS_PER_DAY
        value: "300"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "300"
      - key: OPENAI_CHARACTER_COOLDOWN_CITY_MINUTES
        value: "180"
