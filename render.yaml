services:
  - type: web
    name: cidade-zero
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: cidade-zero-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /app/data/cidade_zero.db
      - key: CITY_TICK_SECONDS
        value: "1"
      - key: CITY_MINUTES_PER_TICK
        value: "5"
      - key: ADMIN_TOKEN
        generateValue: true
